<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pôster Outubro Rosa</title>
<link href="fonts-local.css" rel="stylesheet">
<style>
  :root {
    --rosa-escuro: #A8114F;
    --rosa: #D6246E;
    --rosa-medio: #E77BA6;
    --rosa-claro: #F7C9DB;
    --texto: #5E3A4B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #FFF7FA; }
  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: linear-gradient(165deg, #FFFAFC 0%, #FDEAF1 50%, #F8D2E1 100%);
    font-family: 'Poppins', sans-serif; color: var(--texto);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
  .blob.a { width: 620px; height: 620px; right: -140px; top: 40px; background: rgba(244, 160, 196, .45); }
  .blob.b { width: 420px; height: 420px; left: -160px; bottom: 120px; background: rgba(247, 190, 214, .55); }

  /* Tag pequena */
  .tag {
    position: absolute; left: 60px; top: 52px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px 9px 14px; border-radius: 999px;
    background: #fff; border: 1.5px solid #EDB9CE;
    box-shadow: 0 6px 18px rgba(168, 17, 79, .10);
  }
  .tag svg { width: 20px; height: 20px; display: block; }
  .tag .nome { font-weight: 600; font-size: 18px; color: var(--rosa-escuro); letter-spacing: .2px; }
  .tag .sep { width: 1px; height: 18px; background: #EDB9CE; }
  .tag .tipo { font-weight: 400; font-size: 15px; color: #8C5A70; letter-spacing: 1.5px; text-transform: uppercase; }

  .mes {
    position: absolute; right: 60px; top: 62px;
    font-weight: 500; font-size: 15px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--rosa);
  }

  /* Texto vertical decorativo */
  .vertical {
    position: absolute; left: 122px; top: 150px; height: 500px;
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: 78px; line-height: 1; color: #EFA9C6; white-space: nowrap;
    text-align: center;
  }
  .linha { position: absolute; left: 236px; top: 180px; width: 2px; height: 440px;
    background: linear-gradient(#F3B7CF, rgba(243, 183, 207, 0)); }

  /* Pessoa recortada, integrada ao cenário */
  .halo {
    position: absolute; left: 462px; top: 160px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #FBD3E3 0%, #F5B2CD 55%, #EE98BD 100%);
  }
  .anel {
    position: absolute; left: 434px; top: 134px; width: 696px; height: 696px; border-radius: 50%;
    border: 2px solid rgba(214, 36, 110, .28);
  }
  .pessoa {
    position: absolute; left: 412px; top: 112px; width: 668px;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 84%), linear-gradient(to right, transparent 0%, #000 16%);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, #000 62%, transparent 84%), linear-gradient(to right, transparent 0%, #000 16%);
            mask-composite: intersect;
  }
  .pessoa img { width: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(168, 17, 79, .22)); }

  /* Cartão com a arte da campanha */
  .cartao { position: absolute; left: 34px; top: 700px; width: 486px; }
  .cartao img { width: 100%; display: block; mix-blend-mode: multiply; }

  /* Rodapé */
  .rodape { position: absolute; left: 60px; right: 60px; top: 1126px; }
  .rodape h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;
    font-size: 52px; line-height: 1.1; color: var(--rosa-escuro); margin-bottom: 22px; white-space: nowrap;
  }
  .rodape .linha-cta { display: flex; align-items: center; justify-content: space-between; gap: 36px; }
  .rodape p { font-size: 21px; line-height: 1.6; max-width: 590px; font-weight: 400; }
  .rodape p strong { font-weight: 600; color: var(--rosa-escuro); white-space: nowrap; }
  .cta {
    flex: none; display: inline-flex; align-items: center; gap: 12px;
    padding: 20px 30px; border-radius: 999px;
    background: linear-gradient(135deg, #E03579, #B3165A); color: #fff;
    font-weight: 600; font-size: 20px; letter-spacing: .3px;
    box-shadow: 0 14px 30px rgba(179, 22, 90, .30);
  }
  .cta svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="poster">
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="tag">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#D6246E" d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h3C14.3 6.1 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/><path fill="#fff" d="M11 9.5h2v2.5h2.5v2H13v2.5h-2V14H8.5v-2H11z"/></svg>
    <span class="nome">Amor e Saúde</span>
    <span class="sep"></span>
    <span class="tipo">clínica</span>
  </div>
  <div class="mes">Prevenção · Câncer de mama</div>

  <div class="vertical">Outubro Rosa</div>
  <div class="linha"></div>

  <div class="anel"></div>
  <div class="halo"></div>
  <div class="pessoa"><img src="pessoa.png" alt=""></div>

  <div class="cartao"><img src="logo.png" alt="Quem ama rosa, se cuida"></div>

  <div class="rodape">
    <h2>Prevenção é um gesto de amor.</h2>
    <div class="linha-cta">
      <p>O diagnóstico precoce do câncer de mama <strong>salva vidas</strong>. Faça seus exames e cuide de você.</p>
      <div class="cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        Agende sua consulta
      </div>
    </div>
  </div>
</div>
</body>
</html>
