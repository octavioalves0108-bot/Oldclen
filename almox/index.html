  let k = 0;
  $('#cmdkList').innerHTML = groups.length ? groups.map(([g, its]) => `<div class="cmdk-g eyebrow">${g}</div>` + its.map(it => { const idx = k++; return `<div class="cmdk-it" role="option" id="ck-${idx}" data-ck="${idx}" aria-selected="${idx === 0}"><span class="ti ${it.c}">${ic(it.i, 16)}</span><div class="grow"><div class="t1 ${it.mono ? 'mono' : ''}">${esc(it.t)}</div>${it.s ? `<div class="t2">${esc(it.s)}</div>` : ''}</div></div>`; }).join('')).join('')
    : `<div class="empty">${ic('search', 24)}<span>Nada encontrado para “${esc(q)}”.</span></div>`;
  $('#cmdkIn').setAttribute('aria-activedescendant', CK.items.length ? 'ck-0' : '');
}
function runCmd(i) { const it = CK.items[i]; if (!it) return; closeCmd(); it.run(); }

/* ================= Actions (delegated) ================= */
const ACT = {
  go: (el, e) => { e.preventDefault(); closeDrawer(); go(el.dataset.to); },
  cmd: () => openCmd(),
  close: () => closeDrawer(),
  mov: el => openMovDrawer({ tipo: el.dataset.tipo, materialId: el.dataset.id, pessoa: el.dataset.pessoa, qtd: el.dataset.qtd, back: el.dataset.back }),
  mat: (el, e) => { e.preventDefault(); openMat(el.dataset.id); },
  newmat: () => openMatForm(),
  editmat: el => openMatForm(el.dataset.id),
  delmat: async el => { const m = matById(el.dataset.id); if (!m) return; if (await ask(`Excluir ${m.nome}?`, 'O material sai do estoque. As movimentações já registradas continuam no histórico.', 'Excluir material', true)) { if (await write(() => Store.api.del('materiais/' + m.id), 'Material excluído')) closeDrawer(); } },
  modem: (el, e) => { e.preventDefault(); openModem(el.dataset.id); },
  newmodem: el => openModemForm({ mac: el.dataset.mac, audit: el.dataset.audit === '1' }),
  editmodem: el => openModemForm({ id: el.dataset.id }),
  delmodem: async el => { const m = modemById(el.dataset.id); if (!m) return; if (await ask(`Excluir o modem ${macFmt(m.id)}?`, 'O cadastro e o status de auditoria deste modem serão apagados. O histórico de movimentações continua.', 'Excluir modem', true)) { if (await write(() => Store.api.del('modems/' + m.id), 'Modem excluído')) closeDrawer(); } },
  bulk: () => openBulk(),
  audit: async el => { const hex = el.dataset.id; if (!modemById(hex)) return; el.disabled = true; if (await write(() => auditModem(hex))) { beep('ok'); toast(`Modem ${macFmt(hex)} auditado`, 'ok', { ms: 2200 }); } el.disabled = false; },
  unaudit: async el => { const hex = el.dataset.id; if (await write(() => Store.api.update('modems/' + hex, { auditCiclo: null, auditTs: null, auditPor: null, auditResultado: null, auditObs: '' }), 'Auditoria desfeita')) { const r = $('#a-res'); if (r && S.view === 'auditoria') r.innerHTML = ''; } },
  divform: el => {
    const hex = el.dataset.id;
    const host = (el.closest('.sres') && el.closest('.sres').querySelector('[data-r="divf"]')) || $('#dd-form');
    if (!host) return;
    host.innerHTML = `<form class="inline-form" style="margin-top:10px" data-div="${hex}"><div class="field"><label for="dv-${hex}">Qual a divergência?</label><input class="in" id="dv-${hex}" maxlength="140" placeholder="Ex.: MAC da etiqueta diferente do aparelho" autocomplete="off"></div><button class="btn btn-danger armed" type="submit">Salvar divergência</button></form>`;
    const f = host.querySelector('form'); f.querySelector('input').focus();
    f.addEventListener('submit', async e => { e.preventDefault(); const obs = f.querySelector('input').value.trim(); if (!obs) { f.querySelector('input').focus(); return; } if (await write(() => auditModem(hex, 'divergente', obs), 'Divergência registrada')) host.innerHTML = ''; });
  },
  mform: el => {
    const hex = el.dataset.id, op = el.dataset.op, host = $('#dd-form'); if (!host) return;
    const cfg = { tecnico: ['Nome do técnico', 'dl-pessoas', 'Confirmar entrega'], instalado: ['Cliente, contrato ou endereço', '', 'Confirmar instalação'], defeito: ['Qual o defeito?', '', 'Marcar defeito'] }[op];
    host.innerHTML = `<form class="box" data-mf="${op}"><div class="inline-form"><div class="field"><label for="mf-x">${cfg[0]}</label><input class="in" id="mf-x" ${cfg[1] ? `list="${cfg[1]}"` : ''} maxlength="80" autocomplete="off"></div><button class="btn ${op === 'defeito' ? 'btn-danger armed' : 'btn-primary'}" type="submit">${cfg[2]}</button><button class="btn btn-ghost" type="button" data-act="mcancel">Cancelar</button></div><div class="err"></div></form>`;
    const f = host.querySelector('form'), inp = f.querySelector('input'); inp.focus();
    f.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim(); if (op === 'tecnico' && !v) { f.querySelector('.err').textContent = 'Informe o nome do técnico.'; inp.focus(); return; } modemMove(hex, op, v); });
  },
  mcancel: () => { const h = $('#dd-form'); if (h) h.innerHTML = ''; },
  mdo: el => modemMove(el.dataset.id, el.dataset.op),
  copymac: el => copyText(macFmt(el.dataset.id), $('#mac-sel')),
  copycsv: () => copyText($('#csv-t').value, $('#csv-t')),
  delmov: el => arm(el, async () => { await write(() => Store.api.del('movs/' + el.dataset.id), 'Lançamento excluído'); }),
  filt: el => { const sc = el.dataset.scope; S.f[sc][el.dataset.key] = el.dataset.val; if (sc === 'mod' && S.view !== 'modems') { go('modems'); return; } V[S.view].update(); },
  lowfilter: () => { S.f.est.f = 'baixo'; S.f.est.q = ''; S.f.est.cat = ''; go('estoque'); },
  pessoa: (el, e) => { e.preventDefault(); S.f.mov.q = el.dataset.nome; S.f.mov.p = 'all'; S.f.mov.t = 'todos'; go('movs'); },
  more: el => { S[el.dataset.k] += el.dataset.k === 'movLimit' ? 150 : el.dataset.k === 'modLimit' ? 200 : 300; V[S.view].update(); },
  export: el => exportCSV(el.dataset.kind),
  examples: async () => { if (await loadExamples() && S.view === 'sistema') go('painel'); },
  rmexamples: () => removeExamples(),
  newcycle: () => newCycle(),
  archive: () => { const s = $('#s-days'); archiveOld(num(s ? s.value : 90) || 90); },
  loadarch: () => loadArchive()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  f(el, e);
});
$('#scrim').addEventListener('click', closeDrawer);
$('#cmdk').addEventListener('click', e => { if (e.target.id === 'cmdk') closeCmd(); const it = e.target.closest('[data-ck]'); if (it) runCmd(+it.dataset.ck); });
$('#cmdkIn').addEventListener('input', e => renderCmd(e.target.value));
$('#cmdkIn').addEventListener('keydown', e => {
  const its = $$('.cmdk-it');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!its.length) return; CK.hi = (CK.hi + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; its.forEach((x, i) => x.setAttribute('aria-selected', String(i === CK.hi))); its[CK.hi].scrollIntoView({ block: 'nearest' }); $('#cmdkIn').setAttribute('aria-activedescendant', its[CK.hi].id); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(CK.hi); }
});
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
  if (e.key === 'Escape') {
    if (modalRes) { modalRes(false); return; }
    if (!$('#cmdk').hidden) { closeCmd(); return; }
    if (DR.open) { closeDrawer(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); $('#cmdk').hidden ? openCmd() : closeCmd(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalRes || !$('#cmdk').hidden) return;
  if (e.key === '/') { e.preventDefault(); openCmd(); }
  else if ((e.key === 'n' || e.key === 'N') && !DR.open) { e.preventDefault(); openMovDrawer({}); }
  else if ((e.key === 'a' || e.key === 'A') && !DR.open) { e.preventDefault(); go('auditoria', { focus: '#a-in' }); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
$('#drawer').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = $$('#drawer button:not([disabled]),#drawer input:not([type="hidden"]):not([hidden]),#drawer select,#drawer textarea,#drawer a[href],#drawer [tabindex="0"]').filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
document.addEventListener('input', e => { if (e.target.id === 's-nome-in') e.target.dataset.touched = '1'; });

/* ================= Clock ================= */
let lastMin = -1;
function tick() {
  const now = new Date();
  const c = $('#p-clock'); if (c) c.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const d = $('#p-date'); if (d) d.textContent = `${WDL[now.getDay()]}, ${now.getDate()} de ${MESL[now.getMonth()]} de ${now.getFullYear()}`;
  if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); if (lastMin % 1 === 0 && ready() && (S.view === 'painel')) { const f = $('#p-feed'); if (f && D.movs.length) f.innerHTML = D.movs.slice(0, 9).map(mv => feedItem(mv)).join(''); } }
}

/* ================= Boot ================= */
function subscribe() {
  const api = Store.api;
  const onErr = e => { S.sync = 'error'; updateChrome(); console.warn('db', e); };
  const seen = new Set(); let primed = false;
  setTimeout(() => { primed = true; }, 4000);
  api.watchColl('materiais', l => { S.materiais = l; S.loaded.materiais = true; changed(); }, onErr);
  api.watchColl('movs', (l, meta, snap) => {
    if (primed && snap && typeof snap.docChanges === 'function') {
      for (const ch of snap.docChanges()) {
        if (ch.type !== 'added') continue;
        const d = ch.doc.data(); if (!d || seen.has(ch.doc.id)) continue; seen.add(ch.doc.id);
        if (d.por && d.por !== S.me.id && Date.now() - (d.criadoEm || d.ts || 0) < 180000) {
          markNew(ch.doc.id);
          toast(`<b>${esc(who(d.por))}</b> · ${movSentence(d)}`, 'info', { html: true, ms: 5200 });
        }
      }
    }
    S.movs = l; S.loaded.movs = true; if (S.sync === 'error') S.sync = 'ok'; changed();
  }, onErr);
  api.watchColl('modems', l => { S.modems = l; S.loaded.modems = true; changed(); }, onErr);
  api.watchDoc('config/geral', d => { S.config = d || {}; S.configExists = !!d; S.loaded.config = true; changed(); }, onErr);
}

async function boot() {
  renderShell();
  const h = (location.hash || '').slice(1), saved = lsGet('almox-view');
  go(V[h] ? h : (V[saved] ? saved : 'painel'), { keepScroll: true });
  updateChrome();
  setInterval(tick, 1000);
  const C = window.claude;
  const use = n => (C && typeof C.use === 'function') ? Promise.resolve(C.use(n)).catch(() => null) : Promise.resolve(null);
  use('user').then(async u => {
    if (!u) return; S.user = u;
    try { S.me = await u.me(); } catch {}
    try { if ((await u.can('data.write')) === false && Store.mode !== 'local') S.readOnly = true; } catch {}
    changed(); renderOnline();
  });
  use('room').then(r => {
    if (!r) return; S.room = r;
    try { r.presence({ view: S.view }).catch(() => {}); r.onPeers(ch => { S.peers = ch.peers; renderOnline(); refreshProfiles(); }, () => { S.peers = []; renderOnline(); }); } catch {}
  });
  use('downloads').then(d => { S.downloads = d; });
  const db = await use('db');
  if (db) { Store.mode = 'cloud'; Store.api = cloudAdapter(db); }
  else { Store.mode = 'local'; Store.api = localAdapter(); S.readOnly = false; }
  subscribe();
  changed();
}
boot();
})();
</script>
